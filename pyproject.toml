[project]
name = "tg-channel-mirror"
version = "0.1.0"
description = "Mirror posts from public TG channels to a private channel via Bot API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
